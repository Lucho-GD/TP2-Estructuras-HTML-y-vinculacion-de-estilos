<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
     <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Contacto</h1>
        <nav>
            <ul><a href="index.html">Inicio</a></ul>
            <ul><a href="acercade.html">Acerca de</a></ul>
            <ul><a href="contacto.html">Contacto</a></ul>   
        </nav>
        <!-- garciadiaz-9325-19 -->
    </header>
    <main>
        <section>
            <h2>Formulario de Contacto</h2>
            <form>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" maxlength="20" required>
                
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" maxlength="20" >

                <label for="correoelectronico">Correo Electrónico:</label>
                <input type="email" id="correoelectronico" name="correoelectronico" required>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" maxlength="20" placeholder="Ej: +54 2920 123456">

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="16" max="120">

                <label for="direccion">Direccion:</label>
                <input type="text" id="direccion" name="direccion">

                <label for="provincia">Provincia:</label>
                <input list="provincias" id="provincia" name="provincia">
                <datalist id="provincias">
                    <option value="Chubut">
                    <option value="La Pampa">
                    <option value="Neuquén">
                    <option value="Río Negro">
                    <option value="Santa Cruz">
                    <option value="Tierra del Fuego">
                </datalist>

                <label for="codigo-postal">Codigo Postal:</label>
                <input type="text" id="codigo-postal" name="codigo-postal" pattern="^[A-Z]\d{4}[A-Z]{3}$" title="Ingrese el codigo postal con el formato R8500AAF">

                <label for="metodo-de-contacto-preferido">Metodo de Contacto preferido:</label>

                <input type="radio" id="correo-electronico" name="metodo-de-contacto-preferido" value="correo-electronico" checked>
                <label for="correo-electronico">Correo Electrónico</label>
                <input type="radio" id="correo-postal" name="metodo-de-contacto-preferido" value="correo-postal">
                <label for="correo-postal">Correo Postal</label>
                <input type="radio" id="telefono" name="metodo-de-contacto-preferido" value="telefono">
                <label for="telefono">Teléfono</label>

                <label for="suscripcion-de-interes">Suscripcion de interes:</label>
                
                <input type="checkbox" id="noticias" name="suscripciones" value="noticias">
                <label for="noticias">Noticias</label>
                <input type="checkbox" id="promociones" name="suscripciones" value="promociones">
                <label for="promociones">Promociones</label>
                <input type="checkbox" id="alertas" name="suscripciones" value="alertas" checked>
                <label for="alertas">Alertas</label>
                <input type="checkbox" id="eventos" name="suscripciones" value="eventos">
                <label for="eventos">Eventos</label>

                <button type="submit" id="btn-cargar-garciadiaz-9325-19">Cargar</button>


            </form>

            <table>
    <thead>
        <tr>
            <th>Campo</th>
            <th>Resumen</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Nombre</td>
            <td id="resumen-nombre"></td>
        </tr>

        <tr>
            <td>Apellido</td>
            <td id="resumen-apellido"></td>
        </tr>

        <tr>
            <td>Correo Electrónico</td>
            <td id="resumen-correo-electronico"></td>
        </tr>

        <tr>
            <td>Teléfono</td>
            <td id="resumen-telefono"></td>
        </tr>

        <tr>
            <td>Edad</td>
            <td id="resumen-edad"></td>
        </tr>

        <tr>
            <td>Dirección</td>
            <td id="resumen-direccion"></td>
        </tr>

        <tr>
            <td>Provincia</td>
            <td id="resumen-provincia"></td>
        </tr>

        <tr>
            <td>CP</td>
            <td id="resumen-codigo-postal"></td>
        </tr>

        <tr>
            <td>Método de Contacto preferido</td>
            <td id="resumen-metodo-de-contacto-preferido"></td>
        </tr>

        <tr>
            <td>Suscripción de interés</td>
            <td id="resumen-suscripcion-de-interes"></td>
        </tr>
    </tbody>
</table>



        </section>
    </main>

    <footer>
        <p>Portal Web - Contacto</p>
    </footer>

        
</body>
</html>
